services:
  postgres:
    image: postgres:18-alpine
    container_name: beauty-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beauty_crm}
      POSTGRES_USER: ${POSTGRES_USER:-beauty_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beauty_crm_password}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-beauty_crm} -d ${POSTGRES_DB:-beauty_crm}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
